<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Skill Tree</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">
                <h1>Workout Skill Tree</h1>
            </div>
            <div class="header-stats">
                <div class="stat">
                    <span class="stat-value" id="completed-count">0</span>
                    <span class="stat-label">Completed</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="available-count">0</span>
                    <span class="stat-label">Available</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="locked-count">0</span>
                    <span class="stat-label">Locked</span>
                </div>
            </div>
            <div class="auth-section">
                <div id="auth-status" class="auth-status">
                    <span id="user-email" class="user-email"></span>
                    <button id="logout-btn" class="btn logout-btn" style="display: none;">Log Out</button>
                    <button id="login-btn" class="btn login-btn">Log In</button>
                </div>
            </div>
        </header>

        <div id="auth-modal" class="modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <button class="modal-close"><i class="fas fa-times"></i></button>
                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">Log In</button>
                    <button class="auth-tab" data-tab="signup">Sign Up</button>
                </div>
                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" name="email" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" required placeholder="Enter password">
                    </div>
                    <div id="login-error" class="form-error hidden"></div>
                    <button type="submit" class="btn primary-btn auth-submit">Log In</button>
                </form>
                <form id="signup-form" class="auth-form hidden">
                    <div class="form-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" name="email" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" name="password" required minlength="6" placeholder="At least 6 characters">
                    </div>
                    <div class="form-group">
                        <label for="signup-confirm">Confirm Password</label>
                        <input type="password" id="signup-confirm" name="confirm" required placeholder="Confirm password">
                    </div>
                    <div id="signup-error" class="form-error hidden"></div>
                    <button type="submit" class="btn primary-btn auth-submit">Sign Up</button>
                </form>
            </div>
        </div>

        <div id="create-exercise-modal" class="modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <button class="modal-close" id="close-create-exercise"><i class="fas fa-times"></i></button>
                <h2>Create New Exercise</h2>
                <form id="create-exercise-form" class="auth-form">
                    <div class="form-group">
                        <label for="exercise-name">Exercise Name *</label>
                        <input type="text" id="exercise-name" name="name" required placeholder="e.g., Muscle-up">
                    </div>
                    <div class="form-group">
                        <label for="exercise-description">Description</label>
                        <textarea id="exercise-description" name="description" rows="3" placeholder="Describe the exercise..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="exercise-category">Category</label>
                            <select id="exercise-category" name="category">
                                <option value="Custom">Custom</option>
                                <option value="Strength">Strength</option>
                                <option value="Flexibility">Flexibility</option>
                                <option value="Balance">Balance</option>
                                <option value="Cardio">Cardio</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="exercise-difficulty">Difficulty (1-5)</label>
                            <input type="number" id="exercise-difficulty" name="difficulty" min="1" max="5" value="1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Prerequisites (exercises that must be completed first)</label>
                        <div id="prereq-select" class="multi-select">
                            <div class="multi-select-options" id="prereq-options"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Next Exercises (exercises this unlocks)</label>
                        <div id="next-select" class="multi-select">
                            <div class="multi-select-options" id="next-options"></div>
                        </div>
                    </div>
                    <div id="create-exercise-error" class="form-error hidden"></div>
                    <button type="submit" class="btn primary-btn auth-submit">Create Exercise</button>
                </form>
            </div>
        </div>

        <main class="main-content fullscreen">
            <section class="skill-tree-container fullscreen">
                <div class="controls-overlay">
                    <button class="zoom-in" title="Zoom In"><i class="fas fa-plus"></i></button>
                    <button class="zoom-out" title="Zoom Out"><i class="fas fa-minus"></i></button>
                    <button class="reset" title="Reset View"><i class="fas fa-sync-alt"></i></button>
                    <button id="create-exercise-btn" class="create-exercise-btn hidden" title="Create Exercise"><i class="fas fa-plus-circle"></i></button>
                </div>
                
                <div class="legend-overlay">
                    <div class="legend-item">
                        <div class="node-example completed"></div>
                        <span>Completed</span>
                    </div>
                    <div class="legend-item">
                        <div class="node-example available"></div>
                        <span>Available</span>
                    </div>
                    <div class="legend-item">
                        <div class="node-example locked"></div>
                        <span>Locked</span>
                    </div>
                </div>

                <div class="skill-tree-viewport">
                    <div id="skill-tree" class="skill-tree"></div>
                </div>

                <div id="exercise-tooltip" class="exercise-tooltip hidden">
                    <div class="tooltip-header">
                        <h3 class="tooltip-title">Exercise Name</h3>
                        <span class="tooltip-category">Category</span>
                    </div>
                    <div class="tooltip-body">
                        <p class="tooltip-description">Description</p>
                        <div class="tooltip-prereqs">
                            <strong>Prerequisites:</strong>
                            <ul class="prereqs-list"></ul>
                        </div>
                        <div class="tooltip-difficulty">
                            <strong>Difficulty:</strong> <span class="difficulty-value">1</span>
                        </div>
                    </div>
                    <div class="tooltip-actions">
                        <button class="btn primary-btn tooltip-complete-btn">Mark Complete</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/auth.js" defer></script>
    <script src="js/skill-tree.js" defer></script>
    <script src="js/progress-tracker.js" defer></script>
    <script src="js/exercise-creator.js" defer></script>
    <script src="js/animations.js" defer></script>
</body>
</html>
