<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Skill Tree</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">
                <h1>Workout Skill Tree</h1>
            </div>
            <div class="header-stats">
                <div class="stat">
                    <span class="stat-value" id="completed-count">0</span>
                    <span class="stat-label">Completed</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="available-count">0</span>
                    <span class="stat-label">Available</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="locked-count">0</span>
                    <span class="stat-label">Locked</span>
                </div>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="#" class="active">Skill Tree</a></li>
                    <li><a href="#">Progress</a></li>
                    <li><a href="#">Settings</a></li>
                </ul>
            </nav>
        </header>

        <main class="main-content fullscreen">
            <section class="skill-tree-container fullscreen">
                <div class="controls-overlay">
                    <button class="zoom-in" title="Zoom In"><i class="fas fa-plus"></i></button>
                    <button class="zoom-out" title="Zoom Out"><i class="fas fa-minus"></i></button>
                    <button class="reset" title="Reset View"><i class="fas fa-sync-alt"></i></button>
                </div>
                
                <div class="legend-overlay">
                    <div class="legend-item">
                        <div class="node-example completed"></div>
                        <span>Completed</span>
                    </div>
                    <div class="legend-item">
                        <div class="node-example available"></div>
                        <span>Available</span>
                    </div>
                    <div class="legend-item">
                        <div class="node-example locked"></div>
                        <span>Locked</span>
                    </div>
                </div>

                <div class="skill-tree-viewport">
                    <div id="skill-tree" class="skill-tree"></div>
                </div>

                <div id="exercise-tooltip" class="exercise-tooltip hidden">
                    <div class="tooltip-header">
                        <h3 class="tooltip-title">Exercise Name</h3>
                        <span class="tooltip-category">Category</span>
                    </div>
                    <div class="tooltip-body">
                        <p class="tooltip-description">Description</p>
                        <div class="tooltip-prereqs">
                            <strong>Prerequisites:</strong>
                            <ul class="prereqs-list"></ul>
                        </div>
                        <div class="tooltip-difficulty">
                            <strong>Difficulty:</strong> <span class="difficulty-value">1</span>
                        </div>
                    </div>
                    <div class="tooltip-actions">
                        <button class="btn primary-btn tooltip-complete-btn">Mark Complete</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/skill-tree.js" defer></script>
    <script src="js/progress-tracker.js" defer></script>
    <script src="js/animations.js" defer></script>
</body>
</html>
