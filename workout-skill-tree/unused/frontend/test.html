<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Skill Tree - Test</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Additional test styles */
        .test-controls {
            margin: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 8px;
        }
        .test-button {
            padding: 8px 16px;
            margin: 5px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .test-button:hover {
            background-color: #3a7bc8;
        }
        .test-log {
            margin-top: 15px;
            padding: 10px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-entry {
            margin: 5px 0;
            font-family: monospace;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <header>
        <h1>Workout Skill Tree - Test Page</h1>
        <div class="user-stats">
            <span id="user-xp">XP: 0</span>
        </div>
    </header>

    <div class="test-controls">
        <h2>Test Controls</h2>
        <button id="test-render" class="test-button">Test Render Skill Tree</button>
        <button id="test-complete" class="test-button">Test Complete Skill</button>
        <button id="test-confetti" class="test-button">Test Confetti Animation</button>
        <button id="reset-progress" class="test-button">Reset Progress</button>
        
        <div class="test-log">
            <h3>Test Log</h3>
            <div id="log-container"></div>
        </div>
    </div>

    <main>
        <div class="skill-tree-container">
            <div id="skill-tree-canvas"></div>
        </div>

        <div id="skill-details" class="skill-details hidden">
            <button id="close-details" class="close-button">&times;</button>
            <h2 id="skill-name"></h2>
            <div class="skill-info">
                <p id="skill-description"></p>
                <p><strong>Difficulty:</strong> <span id="skill-difficulty"></span></p>
                <p><strong>XP Reward:</strong> <span id="skill-xp"></span></p>
                <p><strong>Category:</strong> <span id="skill-category"></span></p>
            </div>
            <div class="skill-actions">
                <button id="complete-skill" class="action-button">Mark as Complete</button>
            </div>
        </div>
    </main>

    <div id="confetti-container"></div>

    <script>
        // Mock data for testing
        const mockSkillTreeData = {
            "nodes": [
                {
                    "id": "pushup_basic",
                    "name": "Basic Push-up",
                    "description": "Standard push-up with proper form",
                    "difficulty": 1,
                    "category": "upper_body",
                    "prerequisites": [],
                    "videoUrl": "https://example.com/videos/basic-pushup.mp4",
                    "imageUrl": "pushup_basic.jpg",
                    "xp": 10
                },
                {
                    "id": "pushup_wide",
                    "name": "Wide Push-up",
                    "description": "Push-up with hands placed wider than shoulders",
                    "difficulty": 2,
                    "category": "upper_body",
                    "prerequisites": ["pushup_basic"],
                    "videoUrl": "https://example.com/videos/wide-pushup.mp4",
                    "imageUrl": "pushup_wide.jpg",
                    "xp": 15
                },
                {
                    "id": "pushup_diamond",
                    "name": "Diamond Push-up",
                    "description": "Push-up with hands close together forming a diamond shape",
                    "difficulty": 3,
                    "category": "upper_body",
                    "prerequisites": ["pushup_basic"],
                    "videoUrl": "https://example.com/videos/diamond-pushup.mp4",
                    "imageUrl": "pushup_diamond.jpg",
                    "xp": 20
                },
                {
                    "id": "squat_basic",
                    "name": "Basic Squat",
                    "description": "Standard bodyweight squat with proper form",
                    "difficulty": 1,
                    "category": "lower_body",
                    "prerequisites": [],
                    "videoUrl": "https://example.com/videos/basic-squat.mp4",
                    "imageUrl": "squat_basic.jpg",
                    "xp": 10
                },
                {
                    "id": "squat_jump",
                    "name": "Jump Squat",
                    "description": "Explosive squat with a jump at the top",
                    "difficulty": 2,
                    "category": "lower_body",
                    "prerequisites": ["squat_basic"],
                    "videoUrl": "https://example.com/videos/jump-squat.mp4",
                    "imageUrl": "squat_jump.jpg",
                    "xp": 15
                }
            ],
            "categories": [
                {
                    "id": "upper_body",
                    "name": "Upper Body",
                    "color": "#FF5733"
                },
                {
                    "id": "lower_body",
                    "name": "Lower Body",
                    "color": "#33A1FF"
                },
                {
                    "id": "core",
                    "name": "Core",
                    "color": "#33FF57"
                }
            ]
        };

        const mockUserProgress = {
            "completed_skills": [],
            "current_xp": 0,
            "last_updated": new Date().toISOString()
        };

        // Log function
        function log(message, type = 'info') {
            const logContainer = document.getElementById('log-container');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.textContent = message;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Override fetch for testing
        const originalFetch = window.fetch;
        window.fetch = function(url, options) {
            log(`Fetch request to: ${url}`);
            
            if (url.includes('skill_tree.json')) {
                return Promise.resolve({
                    ok: true,
                    json: () => Promise.resolve(mockSkillTreeData)
                });
            }
            
            if (url.includes('user_progress.json')) {
                if (options && options.method === 'POST') {
                    // Update mock progress
                    Object.assign(mockUserProgress, JSON.parse(options.body));
                    log('Progress updated', 'success');
                    return Promise.resolve({ ok: true });
                } else {
                    return Promise.resolve({
                        ok: true,
                        json: () => Promise.resolve(mockUserProgress)
                    });
                }
            }
            
            return originalFetch(url, options);
        };

        // Test functions
        document.getElementById('test-render').addEventListener('click', function() {
            log('Testing skill tree rendering...');
            try {
                // Clear canvas
                document.getElementById('skill-tree-canvas').innerHTML = '';
                
                // Initialize skill tree
                initSkillTree();
                
                log('Skill tree rendered successfully', 'success');
            } catch (error) {
                log(`Error rendering skill tree: ${error.message}`, 'error');
                console.error(error);
            }
        });

        document.getElementById('test-complete').addEventListener('click', function() {
            log('Testing skill completion...');
            try {
                // Complete a root skill
                const skillId = mockSkillTreeData.nodes[0].id;
                completeSkill(skillId);
                
                log(`Skill ${skillId} marked as complete`, 'success');
            } catch (error) {
                log(`Error completing skill: ${error.message}`, 'error');
                console.error(error);
            }
        });

        document.getElementById('test-confetti').addEventListener('click', function() {
            log('Testing confetti animation...');
            try {
                triggerConfetti();
                log('Confetti animation triggered', 'success');
            } catch (error) {
                log(`Error triggering confetti: ${error.message}`, 'error');
                console.error(error);
            }
        });

        document.getElementById('reset-progress').addEventListener('click', function() {
            log('Resetting progress...');
            try {
                mockUserProgress.completed_skills = [];
                mockUserProgress.current_xp = 0;
                mockUserProgress.last_updated = new Date().toISOString();
                
                // Update UI
                document.getElementById('user-xp').textContent = `XP: 0`;
                
                // Re-render skill tree
                document.getElementById('skill-tree-canvas').innerHTML = '';
                initSkillTree();
                
                log('Progress reset successfully', 'success');
            } catch (error) {
                log(`Error resetting progress: ${error.message}`, 'error');
                console.error(error);
            }
        });

        // Load scripts dynamically
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.body.appendChild(script);
            });
        }

        // Load all required scripts
        Promise.all([
            loadScript('js/animations.js'),
            loadScript('js/progress-tracker.js')
        ]).then(() => {
            return loadScript('js/skill-tree.js');
        }).then(() => {
            log('All scripts loaded successfully', 'success');
            log('Click "Test Render Skill Tree" to start', 'info');
        }).catch(error => {
            log(`Error loading scripts: ${error}`, 'error');
            console.error(error);
        });
    </script>
</body>
</html>
